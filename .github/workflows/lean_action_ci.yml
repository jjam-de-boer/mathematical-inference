name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Verify committed Lean dependency manifest
        run: test -f lean/lake-manifest.json
      # These inexpensive tests inspect example import coverage and exercise
      # helper safety with temporary fixtures and fake child processes. They
      # never run Lean or weaken the actual proof and axiom-policy gates below.
      - name: Check regression coverage and resource-capped helper safety
        run: python3 -B -m unittest discover -s lean/tools -p 'test_*.py'
      # The composite lean action reinstalls Elan unconditionally through a
      # floating latest-download URL.  Reuse only a toolchain installation
      # saved after all verification gates passed, and use a digest-checked
      # official installer on misses.  The project still selects its exact
      # Lean version through lean/lean-toolchain; this cache proves nothing
      # about the current source or its axioms.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: lean-toolchain-cache
        with:
          path: ~/.elan
          key: elan-v4.2.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install or reuse the pinned Lean toolchain
        working-directory: lean
        env:
          TOOLCHAIN_CACHE_HIT: ${{ steps.lean-toolchain-cache.outputs.cache-hit }}
        run: |
          if [ "$TOOLCHAIN_CACHE_HIT" != 'true' ]; then
            lean_ci_install_dir="$(mktemp -d)"
            curl --fail --location --connect-timeout 15 --max-time 60 \
              --retry 3 --retry-all-errors --retry-delay 10 \
              --output "$lean_ci_install_dir/elan.tar.gz" \
              https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
            printf '%s  %s\n' \
              42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 \
              "$lean_ci_install_dir/elan.tar.gz" | sha256sum --check -
            tar -xzf "$lean_ci_install_dir/elan.tar.gz" -C "$lean_ci_install_dir"
            "$lean_ci_install_dir/elan-init" -y --default-toolchain none
          fi
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # A cold install may still need the exact Lean release.  Bound
          # retries for transient release-download failures; a failed final
          # attempt remains a hard failure, never a skipped proof check.
          lean_ci_ready=false
          for lean_ci_attempt in 1 2 3; do
            if "$HOME/.elan/bin/lean" --version; then
              lean_ci_ready=true
              break
            fi
            if [ "$lean_ci_attempt" -lt 3 ]; then sleep 10; fi
          done
          [ "$lean_ci_ready" = true ]
          "$HOME/.elan/bin/lake" --version
      # Reuse completed module artifacts even when a later proof or policy
      # check fails.  Lake still checks dependency traces; a cache is never
      # treated as evidence that this commit built or passed the axiom audit.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/lake-manifest.json') }}-
      # These are the same targeted build, complete build and policy gates
      # previously run by the composite action.  No verification is replaced
      # by the runtime cache, and the optional test/lint detection is retained.
      # Detect forbidden dependencies in new arithmetic foundations before
      # rebuilding downstream causal modules.  The complete axiom gate below
      # remains unchanged and mandatory after the full build.
      - name: Check constructive arithmetic prerequisites
        working-directory: lean
        run: lake build Thesis.ConstructiveAlgebraAudit
      # Diagnose graph-layer extraction errors before rebuilding the larger
      # native causal clients. The complete build and axiom gate still follow.
      - name: Check graph-only identification layers
        working-directory: lean
        run: >-
          lake build
          Thesis.Causality.ReachabilityCorrectness
          Thesis.Causality.ComponentConnectivity
          Thesis.Causality.IdentificationRank
          Thesis.CausalTransport.KernelIdentification
          Thesis.CausalTransport.KernelSeparation
      - name: Check exact expression support analysis
        working-directory: lean
        run: >-
          lake build
          Thesis.Causality.ProbabilityStatus
          Thesis.Probability.FiniteRecordSupport
          Thesis.CausalTransport.ObservationalFormulaSupport
          Thesis.CausalTransport.FormulaSupportCatalogue
          Thesis.Examples.ObservationalFormulaSupport
      - name: Check finite-presentation adapters
        working-directory: lean
        run: >-
          lake build
          Thesis.Probability.FiniteRecordPresentation
          Thesis.Probability.FiniteProductPresentation
          Thesis.CausalTransport.HiddenDAGSourcePresentation
          Thesis.CausalTransport.HiddenDAGCompactSources
          Thesis.CausalTransport.HiddenDAGReachableValues
          Thesis.CausalTransport.HiddenDAGValuePresentation
          Thesis.Examples.HiddenDAGReachableValues
          Thesis.Examples.HiddenDAGValuePresentation
          Thesis.Examples.HiddenDAGSourcePresentation
          Thesis.Examples.HiddenDAGCompactSources
          Thesis.Examples.FiniteRecordPresentation
          Thesis.Examples.FiniteProductPresentation
          Thesis.Examples.HiddenDAGFinitePresentation
          Thesis.Examples.HiddenDAGMultivaluedPresentation
          Thesis.Examples.LocalCheckBaseline
          Thesis.Examples.LocalCheckImports
          Thesis.Examples.LocalCheckCoreImports
          Thesis.Examples.LocalCheckDefinition
          Thesis.Examples.LocalCheckFiniteDecision
      - name: Check distribution axiom prerequisites
        working-directory: lean
        run: lake build Thesis.DistroAxiomAudit
      - name: Build distribution extensions
        working-directory: lean
        run: >-
          lake build
          Thesis.Probability.Distros.ReinforcedVariance
          Thesis.Probability.Distros.RationalBetaBinomial
          Thesis.Probability.Distros.RationalUpdates
          Thesis.Examples.DistributionExtensions
      - name: Build load-bearing Lean modules
